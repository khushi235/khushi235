name: Refresh profile cards

# Fire-and-forget: regenerate the diamond-themed SVG cards from live GitHub
# data on a schedule, whenever the renderer changes, and on demand.
on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  push:
    branches: [main]
    paths:
      - "render_cards.py"
      - ".github/workflows/cards.yml"
  workflow_dispatch:

# Least-privilege: only allow writing back the regenerated SVGs.
permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python render_cards.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --cached --quiet; then
            echo "No changes to the cards."
          else
            git commit -m "chore: refresh profile cards [skip ci]"
            git push
          fi
